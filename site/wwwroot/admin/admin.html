<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin &middot; Gunfight Status</title>
  <meta name="theme-color" content="#0b0d10" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- This page had NO icon at all. Both hrefs are ROOT-RELATIVE because admin.html is the one
       page not served from the web root: a bare "assets/logo.png" would resolve to
       /admin/assets/logo.png and 404. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff7a1a'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial' font-size='15' font-weight='800' text-anchor='middle' fill='%231a1106'%3EGF%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <style>
    :root{
      --bg:#0b0d10; --panel:#14171c; --panel2:#191d23; --bd:#262b33;
      --tx:#e7ebf0; --dm:#8b94a2; --accent:#ff7a1a; --ok:#2ec653; --ng:#e63946; --r:10px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tx);
      font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.45}
    .wrap{max-width:900px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--accent);text-decoration:none}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .back{font-size:13px;color:var(--dm)} .back:hover{color:var(--tx)}
    .chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
      color:#1a1106;background:var(--accent);border-radius:999px;padding:4px 11px}
    .dot{width:8px;height:8px;border-radius:50%;background:#1a1106;opacity:.5}
    .dot.on{background:#0b3d16;opacity:1}
    h1{font-size:21px;margin:0 0 2px;font-weight:800}
    h1 .accent{color:var(--accent)}
    .meta{color:var(--dm);font-size:13px;margin-bottom:16px}
    .card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
    .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dm);margin:0 0 10px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
    th{color:var(--dm);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
    td.name{width:40%;white-space:normal;overflow-wrap:anywhere}
    .tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
    .tag.allies{color:var(--ok);border:1px solid rgba(46,198,83,.4)}
    .tag.axis{color:var(--ng);border:1px solid rgba(230,57,70,.4)}
    .tag.other{color:var(--dm);border:1px solid var(--bd)}
    .pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3a4150;margin-right:6px}
    .pdot.alive{background:var(--ok)}
    .ip{font-variant-numeric:tabular-nums;color:#c7d0dc}
    .mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12px;
      background:#0c0f13;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;
      overflow-x:auto;max-height:420px;overflow-y:auto}
    .mono div{white-space:pre;color:#cdd6e2}
    .empty{color:var(--dm);font-size:13px;padding:6px 0}
    .foot{color:#6b7482;font-size:12px;text-align:center;margin-top:10px}
    .warn{font-size:12px;color:#e8b339;border:1px solid rgba(232,179,57,.35);
      background:rgba(232,179,57,.06);border-radius:8px;padding:8px 10px;margin-bottom:14px}
    .search{width:100%;margin:2px 0 10px;padding:9px 11px;font-size:14px;color:var(--tx);
      background:#0c0f13;border:1px solid var(--bd);border-radius:8px;outline:none}
    .search:focus{border-color:var(--accent)}
    .search::placeholder{color:#5f6874}
    .hcount{color:var(--dm);font-size:12px;margin:0 0 8px}
    .hfoot{color:#6b7482;font-size:11px;margin-top:8px}
    .htable{overflow-x:auto}
    td.gid{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:11px;color:#9aa4b2}
    .ev{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
    .ev.connect{color:var(--ok);border:1px solid rgba(46,198,83,.4)}
    .ev.left{color:var(--dm);border:1px solid var(--bd)}
    .ev.online{color:var(--accent);border:1px solid rgba(255,122,26,.4)}
    /* server-health card */
    .hhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
    .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
      padding:3px 11px;border-radius:999px;letter-spacing:.04em}
    .pill.ok{color:#0b3d16;background:var(--ok)}
    .pill.bad{color:#2a0708;background:var(--ng)}
    .pill.warn{color:#2a1c05;background:#e8b339}
    @keyframes hpulse{0%,100%{opacity:1}50%{opacity:.5}}
    .pill.live{animation:hpulse 1.1s ease-in-out infinite}
    .hbanner{font-size:13px;font-weight:600;color:#2a1c05;background:#e8b339;
      border-radius:8px;padding:9px 12px;margin-top:10px}
    .hstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin-top:10px}
    .hstat .cell{background:var(--panel2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
    .hstat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dm)}
    .hstat .v{font-size:16px;font-weight:700;margin-top:3px;overflow-wrap:anywhere}
    /* all-time stats card: flags, playtime leaderboard, country bars */
    .flag{width:15px;height:15px;flex:0 0 auto;border-radius:50%;display:inline-block;
      vertical-align:-3px;margin-right:7px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
    .flag-none{box-shadow:none;background:transparent;width:15px;height:15px;
      display:inline-block;vertical-align:-3px;margin-right:7px}
    td.rank{width:26px;color:var(--dm);font-variant-numeric:tabular-nums}
    td.dur{font-variant-numeric:tabular-nums;color:#c7d0dc}
    .clist{display:flex;flex-direction:column;gap:7px;margin-top:2px}
    .crow{display:flex;align-items:center;gap:9px;font-size:13px}
    .crow .cname{color:var(--tx);width:150px;flex:0 0 auto;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
    .crow .cbar{flex:1;height:8px;min-width:50px;border-radius:999px;background:#0c0f13;
      border:1px solid var(--bd);overflow:hidden}
    .crow .cbar > i{display:block;height:100%;background:var(--accent)}
    .crow .cn{font-variant-numeric:tabular-nums;color:#c7d0dc;width:30px;text-align:right}
    /* region rows carry a second, dimmer country label, so the name column is narrower */
    .crow .csub{color:var(--dm);font-size:11px;width:104px;flex:0 0 auto;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
    .crow.rrow .cname{width:132px}
    .stnote{color:#6b7482;font-size:11px;margin-top:9px}
    /* stats chrome: the window bar is built once and never re-rendered, so it
       sits OUTSIDE the card stack the 60s refresh rebuilds */
    .sbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
      flex-wrap:wrap;margin:0 0 10px}
    .skick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dm)}
    .seg{display:inline-flex;background:var(--panel);border:1px solid var(--bd);
      border-radius:999px;padding:2px}
    .seg button{appearance:none;border:0;background:transparent;color:var(--dm);cursor:pointer;
      font:inherit;font-size:12px;font-weight:700;padding:4px 13px;border-radius:999px;
      line-height:1.4}
    .seg button:hover{color:var(--tx)}
    .seg button.on{background:var(--accent);color:#1a1106}
    /* sortable leaderboard */
    table.lb th.srt{cursor:pointer;user-select:none}
    table.lb th.srt:hover{color:var(--tx)}
    .arw{margin-left:4px;color:var(--accent)}
    tr.rowlink{cursor:pointer}
    tr.rowlink:hover{background:var(--panel2)}
    tr.picked{background:rgba(255,122,26,.09)}
    .alias{margin-left:6px;font-size:10px;font-weight:700;color:var(--dm);
      border:1px solid var(--bd);border-radius:999px;padding:0 5px}
    /* connects-by-hour histogram */
    .hours{display:flex;align-items:flex-end;gap:3px;height:92px;margin-top:4px}
    .hours .hb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
    .hours .hb > i{display:block;background:#5a4633;border-radius:3px 3px 0 0;min-height:2px}
    .hours .hb.pk > i{background:var(--accent)}
    .hlab{display:flex;gap:3px;margin-top:4px}
    .hlab span{flex:1;text-align:center;font-size:9px;color:#6b7482;
      font-variant-numeric:tabular-nums}
    /* day rows reuse the country-bar layout; the date is short, the note is on the right */
    .crow.drow .cname{width:96px;font-variant-numeric:tabular-nums}
    .crow.drow .csub{width:64px;text-align:right}
    .crow.drow .cn{width:58px}
    /* player drill-down */
    .pcard{border-color:rgba(255,122,26,.45)}
    .xbtn{appearance:none;border:1px solid var(--bd);background:transparent;color:var(--dm);
      cursor:pointer;font:inherit;font-size:11px;padding:2px 10px;border-radius:999px;
      margin-left:auto}   /* .hhead is shared with the health card; only this button floats right */
    .xbtn:hover{color:var(--tx);border-color:var(--accent)}
    .chips{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:9px}
    .clab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dm);
      margin-right:2px}
    .chip{font-size:11px;color:#c7d0dc;background:var(--panel2);border:1px solid var(--bd);
      border-radius:6px;padding:1px 7px;overflow-wrap:anywhere}
    .chip.mono1{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:10px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="back" href="/status.html">&larr; public status</a>
      <span class="chip"><span id="liveDot" class="dot"></span>ADMIN</span>
    </div>
    <h1>Admin <span class="accent">Console</span></h1>
    <p class="meta" id="metaLine">&nbsp;</p>
    <div class="warn">Private view: contains player IP addresses. Do not share screenshots.</div>

    <div id="health"></div>
    <div id="content"></div>
    <div id="stats"></div>
    <div id="history"></div>
    <p class="foot" id="foot">&nbsp;</p>
  </main>

  <!-- ?v= is the ONLY cache key the browser has: IIS serves .js with a long cache
       lifetime and .html with a short one, so a returning admin gets the new HTML
       with the OLD script unless this number moves. Bump it on every admin.js edit. -->
  <script src="admin.js?v=1"></script>
</body>
</html>
